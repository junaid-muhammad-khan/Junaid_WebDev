<!DOCTYPE html>
<html lang="en">
<head>
    <title>Fish Creek - Survey</title>
    <meta charset="utf-8">
    <meta name="description" content="Help us improve our care by participating in our pet owner satisfaction survey.">
    <link rel="stylesheet" href="fishcreek.css">
</head>
<body>
<div id="wrapper">
    <header><h1>Fish Creek Animal Clinic</h1></header>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="askthevet.html">Ask the Vet</a>
        <a href="shop.html">Shop</a>
        <a href="survey.html">Survey</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
    <main>
        <h2>Customer Satisfaction Survey</h2>
        <form method="post" action="https://webdevbasics.net/scripts/demo.php">
            <label for="myFName">Name:</label>
            <input type="text" name="myFName" id="myFName" required><br><br>

            <p>How would you rate our service?</p>
            <input type="radio" name="rate" id="excellent" value="excellent">
            <label for="excellent">Excellent</label>
            <input type="radio" name="rate" id="good" value="good">
            <label for="good">Good</label><br><br>

            <p>Which pets do you bring to us?</p>
            <input type="checkbox" name="p1" id="d" value="dog"><label for="d">Dog</label>
            <input type="checkbox" name="p2" id="c" value="cat"><label for="c">Cat</label><br><br>

            <label for="comments">Tell us more:</label><br>
            <textarea name="comments" id="comments" rows="3" cols="30"></textarea><br><br>

            <input type="submit" value="Send Survey">
        </form>
    </main>
    <footer>
        Copyright &copy; 2026 Fish Creek Animal Clinic<br>
        <a href="mailto:junaid@khan.com">junaid@khan.com</a>
    </footer>
</div>
</body>
</html>
