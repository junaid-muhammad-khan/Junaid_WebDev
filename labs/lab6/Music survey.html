<!DOCTYPE html>

<html lang="en">

<head>

<title>Music Survey</title>

<meta charset="utf-8">

<style>

form { font-family:Arial;

font-size:90%;

padding-left: 5px;

margin-top:10px; }

label { display: block; }

legend, label {font-weight: bold; }

fieldset { width: 480px;

margin: 10px 0}

textarea, select { display: block;

margin-bottom: 10px; }

</style>

</head>

<body>

<h1>Music Survey</h1>

<form method="post" action="https://webdevbasics.net/scripts/demo.php">

<label for="name">Name:</label>

<input type="text" name="name" id="name">

<label for="email">E-Mail: </label>

<input type="text" name="email" id="email">

<fieldset><legend>Select Your Favorite Types of Music:</legend>

<label><input type="checkbox" name="Pop" id="Pop" value="Yes"> Pop</label>

<label><input type="checkbox" name="Classical" id="Classical" value="Yes"> Classical</label>

<label><input type="checkbox" name="Rock" id="Rock" value="Yes"> Rock</label>

<label><input type="checkbox" name="Folk" id="Folk" value="Yes"> Folk</label>

<label><input type="checkbox" name="Rap" id="Rap" value="Yes"> Rap</label>

<label><input type="checkbox" name="Other" id="Other" value="Yes"> Other</label>

</fieldset>

<fieldset><legend>Select how often you purchase Music CDs:</legend>

<label><input type="radio" value="Weekly" checked="checked"

name="Frequency" id="PurchaseWeek"> Weekly</label>

<label><input type="radio" name="Frequency" value="A Few Each Year"

id="PurchaseFew"> A few CDs each year</label>

<label><input type="radio" name="Frequency" value="Monthly"

id="PurchaseMonthly"> Monthly</label>

<label><input type="radio" name="Frequency" value="Never"

id="PurchaseNever"> Never purchase</label>

</fieldset>

<label for="locations">Select the locations you listen to Music:</label>

<select size="3" name="locations" multiple="multiple" id="locations" >

<option value="None selected" selected="selected">Select one or more locations</option>

<option value="At home">At home</option>

<option value="In car">In the car</option>

<option value="Anywhere">Anywhere (MP3 Player)</option>

</select>

<label for="role">What role does music play in your life?</label>

<textarea rows="3" name="role" id="role" cols="60"></textarea>

<input type="submit" value="Submit"> <input type="reset">

</form>

</body>

</html
